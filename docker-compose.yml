services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lendloop-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_TUNNEL_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=UTC
      # Enable Node's built-in crypto module inside Code nodes for HMAC-SHA256 signing/verification
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # Allow workflows to read non-hardcoded runtime env vars (secrets stay out of workflow JSON)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:-https://opulent-jaguar-894.convex.site}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
